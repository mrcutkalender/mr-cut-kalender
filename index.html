<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR. CUT | Kalenderdemo</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#243044;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#101d31;color:white;gap:12px}.brand{font-size:22px;font-weight:850;letter-spacing:1px}.brand span{color:#d8b77c}.sub{font-size:11px;color:#b9c3d3;font-weight:450;letter-spacing:0}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid #e0e6ed;padding:20px 15px;overflow:auto}.side-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#78859b;font-weight:800;margin:20px 0 10px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month button,.toolbar button{background:white;border:1px solid #dfe5ee;border-radius:7px;padding:8px 10px}.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.mini span{font-size:10px;color:#8794aa;padding:7px 0}.mini button{border:0;background:transparent;border-radius:6px;min-height:29px;font-size:12px}.mini button.selected{background:#1d5ca9;color:#fff;font-weight:800}.staff-chooser{display:flex;align-items:center;gap:9px;padding:10px 5px;border-radius:7px;cursor:pointer;font-size:13px}.staff-chooser:hover{background:#f3f6fb}.dot{height:10px;width:10px;border-radius:50%;flex:none}.side-note{background:#f1f5fc;color:#607086;padding:12px;border-radius:9px;font-size:12px;line-height:1.6;margin-top:20px}main{min-width:0;display:flex;flex-direction:column}.toolbar{padding:15px 20px;background:#fff;border-bottom:1px solid #e0e6ed;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar h2{font-size:17px;margin:0 10px 0 0}.toolbar button.primary,.primary{background:#205eaa;color:white;border:1px solid #205eaa;border-radius:7px;padding:10px 14px;font-weight:700}.muted{color:#7d8aa1;font-size:12px}.viewport{overflow:auto;flex:1;position:relative}.calendar{position:relative;min-width:630px;background:white;--rowh:16px}.column-heads{position:sticky;top:0;display:grid;z-index:5;background:white;box-shadow:0 2px 5px #00000012}.column-heads>div{padding:13px 5px;text-align:center;font-size:13px;font-weight:800;border-right:1px solid #e6ebf2}.time-head{color:#77869c!important;font-size:11px!important}.gridbody{position:relative;display:grid;align-items:stretch}.time-column{position:relative;border-right:1px solid #e2e7f0;background:#fafbfe}.time-label{position:absolute;right:8px;transform:translateY(-45%);font-size:11px;color:#78879b}.lane{position:relative;border-right:1px solid #dfe5ed;cursor:crosshair;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 15px,#edf0f6 15px,#edf0f6 16px)}.lane:hover{background-color:#fafcff}.line-hour{position:absolute;left:0;right:0;height:1px;background:#cad4e2;pointer-events:none}.booking{position:absolute;left:4px;right:4px;border-left:4px solid;border-radius:5px;padding:4px 7px;overflow:hidden;z-index:2;box-shadow:0 1px 3px #00000014;cursor:pointer;text-align:left;font-size:12px}.booking strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.booking small{font-size:10px}.modalshade{position:fixed;inset:0;background:#1321398a;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modalshade.visible{display:flex}.modal{background:white;border-radius:14px;padding:22px;width:min(430px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 75px #0003}.modal h3{margin:0 0 15px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:750;margin:12px 0 6px}input,select{width:100%;border:1px solid #ccd6e4;padding:10px;border-radius:7px;background:white}.actions{display:flex;gap:8px;align-items:center;margin-top:20px}.actions button{padding:10px 14px;border-radius:7px;border:1px solid #dae1eb;background:#fff}.actions .primary{background:#205eaa;color:#fff}.actions .danger{color:#c43737;margin-left:auto}.error{color:#bc2e2e;font-size:12px;min-height:16px;margin-top:8px}.mobile-trigger{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}aside.open{display:block;position:fixed;top:68px;bottom:0;left:0;width:255px;z-index:10;box-shadow:10px 0 25px #0002}.mobile-trigger{display:inline-block}.toolbar{padding:10px}.toolbar h2{font-size:14px}.calendar{min-width:690px}}.mini button:focus-visible,.booking:focus-visible{outline:3px solid #e0a84f}
</style></head><body><header><div class="brand">✂ MR.<span>CUT</span><div class="sub">PERSONALEKALENDER</div></div><div style="font-size:12px;color:#d0d9e7">DESIGNDEMO · Ingen online kundebooking</div></header><div class="layout"><aside id="sidebar"><div class="month"><button id="prevMonth">‹</button><strong id="monthTitle"></strong><button id="nextMonth">›</button></div><div class="mini" id="mini"></div><div class="side-title">Medarbejdere</div><div id="checks"></div><button id="all" style="width:100%;margin-top:10px;padding:8px;background:#f1f5fb;border:0;border-radius:7px">Vis alle fem</button><div class="side-note"><b>24 timer · hvert 5. minut</b><br>Vælg klokkeslæt i kalenderen for at oprette en aftale. Hold navne øverst ved scroll.</div></aside><main><div class="toolbar"><button class="mobile-trigger" id="menu">☰ Medarbejdere</button><button id="prevDay">←</button><button id="today">I dag</button><button id="nextDay">→</button><h2 id="dayTitle"></h2><button class="primary" id="new">+ Ny aftale</button><span class="muted">Klik på en aftale for at flytte eller redigere</span></div><div class="viewport" id="viewport"><div class="calendar" id="cal"><div class="column-heads" id="heads"></div><div class="gridbody" id="body"></div></div></div></main></div><div class="modalshade" id="shade"><div class="modal"><h3 id="formtitle">Ny aftale</h3><form id="form"><label>Kundens navn</label><input id="client" placeholder="F.eks. Anders Jensen" maxlength="100" required><label>Dato</label><input id="date" type="date" required><label>Medarbejder</label><select id="employee"></select><div class="formrow"><div><label>Start</label><select id="start"></select></div><div><label>Varighed</label><select id="duration"></select></div></div><div class="error" id="error"></div><div class="actions"><button type="button" id="cancel">Annuller</button><button class="primary" type="submit">Gem aftale</button><button type="button" class="danger" id="delete" hidden>Slet</button></div></form></div></div><script>
const staff=[{name:'Walter',color:'#376db3',bg:'#deebfd'},{name:'Wisam',color:'#26845b',bg:'#dff4e6'},{name:'Rim',color:'#8853b6',bg:'#f1e5fb'},{name:'Helen',color:'#c45c85',bg:'#fde4ef'},{name:'Gæst',color:'#747b87',bg:'#ebedf1'}];const $=s=>document.querySelector(s);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let current=today(),visible=new Set(staff.map(s=>s.name)),editing=null,viewMonth=new Date(current+'T12:00:00');const storageKey='mr-cut-calendar-design-demo-2026';let data=[];try{data=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(data))data=[]}catch{}const safeSave=()=>{try{localStorage.setItem(storageKey,JSON.stringify(data))}catch{}};const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');const dateShift=n=>{const d=new Date(current+'T12:00:00');d.setDate(d.getDate()+n);current=todayFor(d);render()};const todayFor=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
for(let i=0;i<288;i++){let op=document.createElement('option');op.value=tm(i*5);op.textContent=tm(i*5);$('#start').append(op)}for(let m=5;m<=240;m+=5){let op=document.createElement('option');op.value=m;op.textContent=m+' minutter';$('#duration').append(op)}for(const s of staff){$('#employee').add(new Option(s.name,s.name))}
function renderMini(){const d=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1),first=(d.getDay()+6)%7,last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('#monthTitle').textContent=d.toLocaleDateString('da-DK',{month:'long',year:'numeric'});$('#mini').innerHTML='';for(const txt of ['M','T','O','T','F','L','S']){const el=document.createElement('span');el.textContent=txt;$('#mini').append(el)}for(let i=0;i<first;i++)$('#mini').append(document.createElement('span'));for(let i=1;i<=last;i++){const dt=todayFor(new Date(d.getFullYear(),d.getMonth(),i));const b=document.createElement('button');b.textContent=i;b.className=dt===current?'selected':'';b.onclick=()=>{current=dt;render()};$('#mini').append(b)}}
function renderChecks(){$('#checks').innerHTML='';for(const s of staff){const l=document.createElement('label');l.className='staff-chooser';l.style.margin='0';const c=document.createElement('input');c.type='checkbox';c.checked=visible.has(s.name);c.style.width='auto';c.onchange=()=>{if(c.checked)visible.add(s.name);else if(visible.size>1)visible.delete(s.name);else{c.checked=true;return}render()};const dot=document.createElement('span');dot.className='dot';dot.style.background=s.color;const name=document.createElement('span');name.textContent=s.name;l.append(c,dot,name);$('#checks').append(l)}}
function render(){viewMonth=new Date(current+'T12:00:00');$('#dayTitle').textContent=new Date(current+'T12:00:00').toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderMini();renderChecks();const selected=staff.filter(s=>visible.has(s.name)),n=selected.length,step=16,h=288*step;$('#heads').style.gridTemplateColumns=`66px repeat(${n},minmax(108px,1fr))`;$('#body').style.gridTemplateColumns=`66px repeat(${n},minmax(108px,1fr))`;$('#body').style.height=h+'px';const heads=$('#heads');heads.innerHTML='<div class="time-head">TID</div>';for(const s of selected){const el=document.createElement('div');el.textContent=s.name;el.style.background=s.bg;el.style.color=s.color;heads.append(el)}const b=$('#body');b.innerHTML='';const time=document.createElement('div');time.className='time-column';time.style.height=h+'px';for(let hour=0;hour<24;hour++){let t=document.createElement('div');t.className='time-label';t.style.top=(hour*12*step+5)+'px';t.textContent=tm(hour*60);time.append(t)}b.append(time);for(const s of selected){const lane=document.createElement('div');lane.className='lane';lane.style.height=h+'px';lane.title='Klik for ny aftale';for(let hour=0;hour<24;hour++){const line=document.createElement('div');line.className='line-hour';line.style.top=hour*12*step+'px';lane.append(line)}lane.onclick=e=>{if(e.target.closest('.booking'))return;const rect=lane.getBoundingClientRect(),scrollY=e.clientY-rect.top;const rounded=Math.max(0,Math.min(287,Math.floor(scrollY/step)));openForm(null,s.name,tm(rounded*5))};for(const a of data.filter(a=>a.date===current&&a.staff===s.name)){const el=document.createElement('button');el.className='booking';el.type='button';el.style.top=mins(a.time)/5*step+2+'px';el.style.height=Math.min(Number(a.duration)/5*step-4,h-mins(a.time)/5*step-2)+'px';el.style.background=s.bg;el.style.color=s.color;el.style.borderColor=s.color;el.innerHTML='<strong></strong><small></small>';el.querySelector('strong').textContent=a.client;el.querySelector('small').textContent=a.time+' · '+a.duration+' min';el.onclick=e=>{e.stopPropagation();openForm(a)};lane.append(el)}b.append(lane)} }
function openForm(a=null,worker='Walter',time='09:00'){editing=a?.id??null;$('#formtitle').textContent=a?'Rediger / flyt aftale':'Ny aftale';$('#client').value=a?.client??'';$('#date').value=a?.date??current;$('#employee').value=a?.staff??worker;$('#start').value=a?.time??time;$('#duration').value=a?.duration??'30';$('#delete').hidden=!a;$('#error').textContent='';$('#shade').classList.add('visible');$('#client').focus()}function closeForm(){$('#shade').classList.remove('visible')}
$('#form').onsubmit=e=>{e.preventDefault();const client=$('#client').value.trim(),date=$('#date').value,staffName=$('#employee').value,time=$('#start').value,duration=Number($('#duration').value),start=mins(time);if(!client||!date)return;if(start+duration>1440){$('#error').textContent='Aftalen skal slutte senest kl. 24:00.';return}if(data.some(x=>x.id!==editing&&x.date===date&&x.staff===staffName&&start<mins(x.time)+Number(x.duration)&&mins(x.time)<start+duration)){$('#error').textContent='Denne frisør har allerede en aftale i tidsrummet.';return}const item={id:editing??String(Date.now())+'-'+Math.random().toString(36).slice(2),client,date,staff:staffName,time,duration};data=editing===null?[...data,item]:data.map(x=>x.id===editing?item:x);safeSave();current=date;visible.add(staffName);render();closeForm()};$('#delete').onclick=()=>{if(editing!==null&&confirm('Slet denne aftale?')){data=data.filter(x=>x.id!==editing);safeSave();render();closeForm()}};$('#cancel').onclick=closeForm;$('#shade').onclick=e=>{if(e.target===$('#shade'))closeForm()};$('#prevDay').onclick=()=>dateShift(-1);$('#nextDay').onclick=()=>dateShift(1);$('#today').onclick=()=>{current=today();render()};$('#new').onclick=()=>openForm(null,staff.find(s=>visible.has(s.name)).name,'09:00');$('#prevMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()-1);renderMini()};$('#nextMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()+1);renderMini()};$('#all').onclick=()=>{visible=new Set(staff.map(s=>s.name));render()};$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');render();requestAnimationFrame(()=>{$('#viewport').scrollTop=7*12*16});
</script></body></html>
